version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /tests
    groups:
      all-python-dependencies:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    groups:
      all-github-actions:
        patterns: ["*"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
