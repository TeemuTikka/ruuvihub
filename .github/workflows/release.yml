name: Release

# Triggered by the vX.Y.Z tag pushed by autotag.yml (or a manual
# MAJOR/MINOR tag you push yourself). Re-runs tests as a safety net,
# assembles the install-package contents, and publishes a GitHub
# Release with the archive attached — this is the file you transfer
# to a Raspberry Pi and install/update with (see README-pi.md).

on:
  push:
    tags:
      - "v*"
  workflow_call:
    # Lets autotag.yml invoke this workflow directly for its patch-bump
    # tags. A tag pushed with the built-in GITHUB_TOKEN does NOT trigger
    # other workflows' `push.tags` events, so relying on the tag push
    # alone would mean auto-tagged commits never get a release archive.
    inputs:
      version:
        description: "Version tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_connection.py

  persisted-data-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compare with the immediately previous published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$version" =~ $stable ]]
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          previous=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ $stable && "$tag" != "$version" && \
                  "$(printf '%s\n' "$tag" "$version" | sort -V | head -n 1)" == "$tag" ]]; then
              previous="$tag"
              break
            fi
          done < <(printf '%s\n' "$published" | sort -Vr)
          if [[ -z "$previous" ]]; then
            echo "No preceding published stable release."
            exit 0
          fi
          git fetch --no-tags origin "refs/tags/$previous"
          git worktree add --detach "$RUNNER_TEMP/previous" FETCH_HEAD
          python -m venv "$RUNNER_TEMP/previous-venv"
          python -m venv "$RUNNER_TEMP/candidate-venv"
          "$RUNNER_TEMP/previous-venv/bin/python" -m pip install -r "$RUNNER_TEMP/previous/requirements.txt"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements.txt
          python scripts/check_persisted_upgrade.py \
            "$RUNNER_TEMP/previous" "$RUNNER_TEMP/previous-venv/bin/python" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate-venv/bin/python"

  build-and-release:
    needs: [test, persisted-data-compatibility]
    runs-on: ubuntu-latest
    environment: release-signing
    env:
      UPDATER_VERSION: v1.0.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Assemble release archive
        env:
          # inputs.* is only populated on workflow_call; on a direct tag
          # push it's empty, so fall back to the pushed tag name.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          python scripts/build_release.py "$VERSION" --output-dir dist --minimum-updater-version "$UPDATER_VERSION"
          echo "ARCHIVE_PATH=dist/ruuvihub-${VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Sign and verify release metadata
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: python scripts/release_metadata.py dist "$VERSION" "$UPDATER_VERSION"

      - name: Package Pi bootstrap
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          python scripts/build_pi_bootstrap.py dist/ruuvihub-pi-bootstrap.pyz
          python -I dist/ruuvihub-pi-bootstrap.pyz --help

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --generate-notes \
            "$ARCHIVE_PATH" dist/release-metadata.json dist/release-metadata.json.sig \
            dist/ruuvihub-pi-bootstrap.pyz
