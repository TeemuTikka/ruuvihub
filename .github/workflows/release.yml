name: Release

# Triggered by the vX.Y.Z tag pushed by autotag.yml (or a manual
# MAJOR/MINOR tag you push yourself). Re-runs tests as a safety net,
# assembles the install-package contents, and publishes a GitHub
# Release with the signed Raspberry Pi and Windows artifacts and publishes
# the Home Assistant app to GitHub Container Registry.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    # Lets autotag.yml invoke this workflow directly for its patch-bump
    # tags. A tag pushed with the built-in GITHUB_TOKEN does NOT trigger
    # other workflows' `push.tags` events, so relying on the tag push
    # alone would mean auto-tagged commits never get a release archive.
    inputs:
      version:
        description: "Version tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_connection.py

  persisted-data-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compare with the immediately previous published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$version" =~ $stable ]]
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          previous=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ $stable && "$tag" != "$version" && \
                  "$(printf '%s\n' "$tag" "$version" | sort -V | head -n 1)" == "$tag" ]]; then
              previous="$tag"
              break
            fi
          done < <(printf '%s\n' "$published" | sort -Vr)
          if [[ -z "$previous" ]]; then
            echo "No preceding published stable release."
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git fetch --no-tags origin "refs/tags/$previous"
          git worktree add --detach "$RUNNER_TEMP/previous" FETCH_HEAD
          python -m venv "$RUNNER_TEMP/previous-venv"
          python -m venv "$RUNNER_TEMP/candidate-venv"
          "$RUNNER_TEMP/previous-venv/bin/python" -m pip install -r "$RUNNER_TEMP/previous/requirements.txt"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: -r requirements.txt
          python scripts/check_persisted_upgrade.py \
            "$RUNNER_TEMP/previous" "$RUNNER_TEMP/previous-venv/bin/python" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/candidate-venv/bin/python"

  windows-installer:
    runs-on: windows-2025
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build Windows x64 installer
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } else { $env:GITHUB_REF_NAME }
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          $inno = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno'
          $pythonHash = '0ba1ee4bfcbdc3a559d27e2e9ce76d04a7839947a23f46375872c755c0d463b8'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.13.17/python-3.13.17-embeddable-amd64.zip' -OutFile $zip
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $inno
          if ((Get-FileHash $inno -Algorithm SHA256).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
            throw 'Inno Setup SHA-256 does not match'
          }
          $install = Start-Process $inno -ArgumentList @('/CURRENTUSER', '/PORTABLE=1', '/VERYSILENT',
            '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$compiler`"") -Wait -PassThru
          if ($install.ExitCode) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          python scripts\build_windows_payload.py $version --python-zip $zip --python-sha256 $pythonHash
          python scripts\build_windows_installer.py $version "dist\ruuvihub-$version-windows-x64" --iscc (Join-Path $compiler 'ISCC.exe')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-installer
          path: dist/ruuvihub-*-windows-x64.exe
          if-no-files-found: error

  home-assistant-images:
    name: Home Assistant image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the app
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tag="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-home-assistant:$version-$BUILD_ARCH"
          docker info --format '{{.ServerVersion}} {{.OSType}} {{.Architecture}}'
          docker build -f home-assistant/Dockerfile --build-arg BUILD_ARCH="$BUILD_ARCH" \
            --build-arg BUILD_VERSION="$version" --tag "$image" .
          python3 home-assistant/smoke_test.py "$image" "$version"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Publish tested image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE"

  build-and-release:
    needs: [test, persisted-data-compatibility, windows-installer, home-assistant-images]
    runs-on: ubuntu-latest
    environment: release-signing
    env:
      UPDATER_VERSION: v1.0.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-installer
          path: dist

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Assemble release archive and metadata
        env:
          # inputs.* is only populated on workflow_call; on a direct tag
          # push it's empty, so fall back to the pushed tag name.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          WINDOWS_INSTALLER="dist/ruuvihub-${VERSION}-windows-x64.exe"
          python scripts/build_release.py "$VERSION" --output-dir dist \
            --minimum-updater-version "$UPDATER_VERSION" --windows-installer "$WINDOWS_INSTALLER"
          echo "ARCHIVE_PATH=dist/ruuvihub-${VERSION}.tar.gz" >> "$GITHUB_ENV"
          echo "WINDOWS_INSTALLER=$WINDOWS_INSTALLER" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Sign and verify release metadata
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: python scripts/release_metadata.py dist "$VERSION" "$UPDATER_VERSION"

      - name: Package Pi bootstrap
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          python scripts/build_pi_bootstrap.py dist/ruuvihub-pi-bootstrap.pyz
          python -I dist/ruuvihub-pi-bootstrap.pyz --help

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --verify-tag --title "$VERSION" --generate-notes \
            "$ARCHIVE_PATH" "$WINDOWS_INSTALLER" dist/release-metadata.json dist/release-metadata.json.sig \
            dist/ruuvihub-pi-bootstrap.pyz
          expected_assets="$(printf '%s\n' \
            "$(basename "$ARCHIVE_PATH")" \
            "$(basename "$WINDOWS_INSTALLER")" \
            release-metadata.json \
            release-metadata.json.sig \
            ruuvihub-pi-bootstrap.pyz | sort)"
          actual_assets="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets do not match the expected release contents." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false

  publish-home-assistant:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish app image index and store listing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${VERSION_INPUT:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-home-assistant:$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-aarch64"
          bash home-assistant/publish_catalog.sh "$version"
