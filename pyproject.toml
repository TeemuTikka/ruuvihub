[project]
name = "ruuvihub"
# The application version is supplied by release archives' VERSION file.
version = "0.0.0"
description = "RuuviTag sensor monitoring and history application"
requires-python = ">=3.11"
dependencies = [
    "ruuvitag-sensor>=4.1.0",
    "bleak>=3.1.0",
    "requests>=2.34.2",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "itsdangerous>=2.2.0",
    "cryptography>=50.0.2",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "pillow>=12.0.0; sys_platform == 'win32'",
]

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
]

[tool.uv]
package = false
required-version = "==0.13.9"
