name: RuuviHub
description: Collect RuuviTag readings and view sensor history in the RuuviHub dashboard.
slug: ruuvihub
version: "0.0.0"
url: https://github.com/TeemuTikka/ruuvihub
image: ghcr.io/teemutikka/ruuvihub-home-assistant
arch:
  - aarch64
  - amd64
host_dbus: true
init: true
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: RuuviHub dashboard (HTTPS)
webui: "https://[HOST]:[PORT:8443]/"
watchdog: "tcp://[HOST]:[PORT:8443]"
